# Alembic configuration for SkillBridge (apps/api).
#
# sqlalchemy.url is intentionally left unset here. The real DB URL is
# injected at runtime by app/db/migrations/env.py via
# app.config.get_settings().database_url (AGENTS.md: "Config via
# pydantic-settings. No hardcoded keys ... in app/config.py" — alembic.ini
# must not duplicate or override that).

[alembic]
# path to migration scripts, relative to this file.
script_location = app/db/migrations

# template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# env.py also inserts the apps/api root explicitly, so this is just a
# convenience for alembic's own CLI invocation from apps/api/.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# timezone =

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; defaults to <script_location>/versions
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator; see alembic docs. Use os.pathsep.
path_separator = os

# set to 'true' to search source files recursively in each
# "version_locations" directory
# recursive_version_locations = false

# the output encoding used when revision files are written
# output_encoding = utf-8

# database URL. Deliberately left blank — see header comment. Never
# hardcode credentials here; env.py sources this from app.config at
# runtime instead.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. Left unconfigured; `make lint`
# (ruff) covers formatting separately.


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
